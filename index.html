<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio | Alex Developer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Initialize theme to prevent flash
      if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
        document.documentElement.classList.add('light')
      } else {
        document.documentElement.classList.remove('light')
      }

      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: '#facc15', // Yellow 400
              secondary: '#22c55e', // Green 500
              // Dynamic Theme Colors mapped to CSS Variables
              dark: 'rgb(var(--color-bg-base) / <alpha-value>)', 
              white: 'rgb(var(--color-text-base) / <alpha-value>)',
              black: 'rgb(var(--color-bg-secondary) / <alpha-value>)',
              slate: {
                800: 'rgb(var(--color-bg-card) / <alpha-value>)',
                900: 'rgb(var(--color-bg-card) / <alpha-value>)',
              },
              gray: {
                300: 'rgb(var(--color-text-muted) / <alpha-value>)',
                400: 'rgb(var(--color-text-muted) / <alpha-value>)',
                500: 'rgb(var(--color-text-muted) / <alpha-value>)',
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Dark Mode (Dark Green & Yellow) */
        --color-bg-base: 2 15 10;       /* Deep Dark Green */
        --color-bg-card: 6 36 24;       /* Slightly lighter Dark Green */
        --color-bg-secondary: 0 5 2;    /* Very Dark Green / almost Black */
        --color-text-base: 255 255 255; /* White */
        --color-text-muted: 153 178 162; /* Lighter green-gray for muted text */
        --color-border: 12 72 48;
      }

      html.light {
        /* Light Mode */
        --color-bg-base: 240 253 244;   /* Green 50 */
        --color-bg-card: 255 255 255;   /* White */
        --color-bg-secondary: 220 252 231; /* Green 100 */
        --color-text-base: 2 44 34;     /* Emerald 950 */
        --color-text-muted: 6 95 70;    /* Emerald 800 */
        --color-border: 167 243 208;
      }

      body {
        background-color: rgb(var(--color-bg-base));
        color: rgb(var(--color-text-base));
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: rgb(var(--color-bg-secondary));
      }
      ::-webkit-scrollbar-thumb {
        background: rgb(var(--color-text-muted));
        border-radius: 5px;
        opacity: 0.5;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #facc15;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "framer-motion": "https://esm.sh/framer-motion@^12.24.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^2.12.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
